name: repo-check

on:
  pull_request:
    paths: ['**/*.md', 'schema/**', 'tools/**', '.github/workflows/repo-check.yml']
  push:
    branches: [main]
    paths: ['**/*.md', 'schema/**', 'tools/**', '.github/workflows/repo-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doc dependencies
        # 纯文档检查：显式装检查依赖，不写进仓库自己的 requirements.txt。
        run: python -m pip install "PyYAML>=6.0" "markdown-it-py>=3.0" "jsonschema>=4.20"
      - name: Invariants (link-only)
        run: python tools/repo-kit/check_repo.py --root .
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
